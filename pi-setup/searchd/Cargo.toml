[package]
name = "searchd"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
ignore = "=0.4.33"
globset = "=0.4.20"
grep-matcher = "=0.1.9"
grep-regex = "=0.1.14"
grep-searcher = "=0.1.17"
grep-printer = "=0.3.1"
regex-syntax = "0.8"
rayon = "1.12"
memmap2 = "0.9"
libc = "0.2"
crc32fast = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Release with symbols, for /usr/bin/sample: cargo build --profile profiling
[profile.profiling]
inherits = "release"
strip = false
debug = 1
